name: AsterFire prebuilt SIF runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-sif.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: asterfire-sif-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_IMAGE: ghcr.io/airpinko/cemmd-science-runtime@sha256:a145bd2fa7dadab62e96962a2821301f585cf6279e0f56dcd4487a122f785f4b
      OUTPUT_IMAGE: ghcr.io/airpinko/cemmd-runtime-build:1.0.0-sif
    steps:
      # No repository checkout: the public wrapper contains dependency files only.
      - name: Install checksum-verified official Apptainer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/apptainer/apptainer/releases/download/v1.5.5/apptainer_1.5.5_amd64.deb \
            --output apptainer.deb
          printf '%s  apptainer.deb\n' 25095d3711504b3e8657dbb2e172ef8db9db43c4503d940c9c36b105db8dce77 | sha256sum --check
          sudo apt-get update
          sudo apt-get install -y ./apptainer.deb
          mkdir -p sif-context sif-proof
          apptainer version > sif-proof/apptainer-version.txt
      - name: Convert the immutable dependency image to SIF
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$SOURCE_IMAGE" > sif-proof/source-image.txt
          sudo apptainer build --disable-cache --mksquashfs-args='-comp gzip' \
            sif-context/cemmd-science_1.0.0.sif "docker://$SOURCE_IMAGE"
          sudo chown "$USER:$USER" sif-context/cemmd-science_1.0.0.sif
          sha256sum sif-context/cemmd-science_1.0.0.sif > sif-proof/sif-sha256.txt
          apptainer sif list sif-context/cemmd-science_1.0.0.sif > sif-proof/sif-partitions.txt
          apptainer inspect --json sif-context/cemmd-science_1.0.0.sif > sif-proof/sif-inspect.json
      - name: Verify isolated Python dependencies without scientific execution
        shell: bash
        run: |
          set -euo pipefail
          cat > sif-proof/check_runtime.py <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import json
          import platform
          import shutil
          import numpy, scipy, matplotlib, PIL, adam_community
          assert platform.machine() == 'x86_64'
          assert importlib.util.find_spec('lammps')
          assert importlib.util.find_spec('packmol')
          assert shutil.which('lmp')
          print(json.dumps({
              'architecture': platform.machine(),
              'python': platform.python_version(),
              'dependencies': {name: metadata.version(name) for name in (
                  'adam-community', 'numpy', 'scipy', 'matplotlib', 'Pillow', 'packmol', 'lammps')},
              'scientific_execution_performed': False,
          }, indent=2))
          PY
          sudo apptainer exec --cleanenv --containall --net --network none \
            --bind "$PWD/sif-proof:/proof:ro" \
            sif-context/cemmd-science_1.0.0.sif \
            python /proof/check_runtime.py > sif-proof/runtime-metadata.json
      - name: Package and verify the official AsterFire SIF directory contract
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 alpine:3.22
          docker image inspect --format '{{index .RepoDigests 0}}' alpine:3.22 > sif-proof/wrapper-base.txt
          cat > sif-context/Dockerfile <<'DOCKER'
          FROM alpine:3.22
          COPY cemmd-science_1.0.0.sif /sif/cemmd-science_1.0.0.sif
          LABEL org.opencontainers.image.source="https://github.com/AirPinko/cemmd-runtime-build"
          LABEL org.opencontainers.image.description="Dependency-only SIF for CemMD; no application source or user data"
          DOCKER
          docker build --platform linux/amd64 -t "$OUTPUT_IMAGE" sif-context
          docker run --rm --network none "$OUTPUT_IMAGE" \
            sha256sum /sif/cemmd-science_1.0.0.sif > sif-proof/wrapped-sif-sha256.txt
          test "$(cut -d ' ' -f 1 sif-proof/sif-sha256.txt)" = "$(cut -d ' ' -f 1 sif-proof/wrapped-sif-sha256.txt)"
      - name: Push the separate SIF tag to the existing public dependency package
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$OUTPUT_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$OUTPUT_IMAGE" > sif-proof/wrapper-image-digest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asterfire-sif-runtime-proof
          path: sif-proof/
          retention-days: 14
          if-no-files-found: warn

